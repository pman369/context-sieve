name: Release

# Triggered by semver tags: v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Binary name as declared in Cargo.toml [[bin]]
  BINARY_NAME: context-sieve-daemon

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Sanity-check before building release artefacts
  # ─────────────────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features daemon -- -D warnings
      - run: cargo test --features daemon

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Build native daemon binaries for all target platforms
  # ─────────────────────────────────────────────────────────────────────────
  build-native:
    name: Build · ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux – GNU (most common server distros)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            cross: false

          # Linux – musl (statically linked, Alpine / Docker scratch)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive_ext: tar.gz
            cross: true

          # Linux ARM64 – GNU (Raspberry Pi, AWS Graviton)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive_ext: tar.gz
            cross: true

          # macOS – Apple Silicon (M-series)
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            cross: false

          # macOS – Intel
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive_ext: tar.gz
            cross: false

          # Windows – MSVC 64-bit
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive_ext: zip
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross is a drop-in cargo wrapper for cross-compilation via Docker
      - name: Install cross (cross-compilation targets only)
        if: matrix.cross
        run: cargo install cross --locked

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --features daemon --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --features daemon --target ${{ matrix.target }}

      # ── Determine binary paths & archive name ─────────────────────────
      - name: Prepare artefacts (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          TARGET_LABEL=$(echo "${{ matrix.target }}" | sed 's/unknown/universal/g')
          ARCHIVE="context-sieve-${TAG}-${TARGET_LABEL}.tar.gz"
          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}"
          # Copy binary to workspace root so tar can include both it and README.md
          # from the same directory (the binary lives in target/…/release/, README.md
          # is at the workspace root).
          cp "${BIN}" "./${BINARY_NAME}"
          tar -czf "${ARCHIVE}" "${BINARY_NAME}" README.md
          rm -f "./${BINARY_NAME}"
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Prepare artefacts (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Tag         = $env:GITHUB_REF_NAME
          $TargetLabel = "${{ matrix.target }}".Replace("unknown", "universal")
          $Bin         = "target\${{ matrix.target }}\release\$env:BINARY_NAME.exe"
          $Zip         = "context-sieve-${Tag}-${TargetLabel}.zip"
          Compress-Archive -Path $Bin, README.md -DestinationPath $Zip
          $Hash        = (Get-FileHash $Zip -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Zip" | Out-File "${Zip}.sha256" -Encoding utf8
          "ARCHIVE=$Zip" | Out-File $env:GITHUB_ENV -Append

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Build the WASM npm package
  # ─────────────────────────────────────────────────────────────────────────
  build-wasm:
    name: Build · WASM (web)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM bundle
        run: wasm-pack build --target web --features wasm --no-default-features

      - name: Package WASM artefact
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="context-sieve-${TAG}-wasm.tar.gz"
          tar -czf "${ARCHIVE}" pkg/
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload WASM artefact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Create the GitHub Release and attach all artefacts
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for CHANGELOG extraction if added later
          fetch-depth: 0

      # Download every artefact from previous jobs into ./dist/
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List artefacts
        run: find dist/ -type f | sort

      # Combine all individual SHA256 files into one manifest
      - name: Create combined SHA256 manifest
        run: |
          TAG="${GITHUB_REF_NAME}"
          find dist/ -name "*.sha256" -exec cat {} \; | sort > "context-sieve-${TAG}-SHA256SUMS.txt"
          cat "context-sieve-${TAG}-SHA256SUMS.txt"
          echo "SHA256_FILE=context-sieve-${TAG}-SHA256SUMS.txt" >> "$GITHUB_ENV"

      # Publish the GitHub Release (draft=false → publishes immediately)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "context-sieve ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # e.g. v1.0.0-beta.1
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            ${{ env.SHA256_FILE }}
